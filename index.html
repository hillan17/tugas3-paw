<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalkulator jQuery - Hillan Tazidi Tsalits</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- jQuery CDN -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <!-- Custom External CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-slate-800 p-6 rounded-2xl shadow-2xl w-full max-w-xs border border-slate-700">
    <!-- Header: NIM & Nama -->
    <div class="mb-4 pb-3 border-b border-slate-700/80 text-center">
      <h1 class="text-xs font-semibold text-slate-400 tracking-wider uppercase mb-1">Kalkulator jQuery</h1>
      <p class="text-lg font-bold text-emerald-400 tracking-wide">Hillan Tazidi Tsalits</p>
      <p class="text-xs text-slate-400 font-mono mt-0.5">235150700111027</p>
    </div>

    <!-- Layar Display -->
    <div class="mb-4">
      <div id="history-display" class="h-5 text-xs font-mono text-slate-400 text-right overflow-hidden tracking-wider mb-1 px-1"></div>
      <div id="main-display" class="bg-slate-950 text-right text-3xl font-mono p-3 rounded-xl border border-slate-800 text-emerald-400 font-semibold tracking-wide overflow-x-auto select-none min-h-[56px] flex items-center justify-end">0</div>
    </div>

    <!-- Grid Tombol Kalkulator -->
    <div class="grid grid-cols-4 gap-2.5">
      <!-- Baris 1: Clear (Span 3) & Bagi -->
      <button class="btn btn-action col-span-3 text-rose-400 border-rose-500/20 hover:bg-rose-500/20 active:bg-rose-500/30 font-semibold" data-action="clear">C</button>
      <button class="btn btn-op text-emerald-400" data-op="/">÷</button>

      <!-- Baris 2: 7, 8, 9, Kali -->
      <button class="btn btn-num" data-num="7">7</button>
      <button class="btn btn-num" data-num="8">8</button>
      <button class="btn btn-num" data-num="9">9</button>
      <button class="btn btn-op text-emerald-400" data-op="*">×</button>

      <!-- Baris 3: 4, 5, 6, Kurang -->
      <button class="btn btn-num" data-num="4">4</button>
      <button class="btn btn-num" data-num="5">5</button>
      <button class="btn btn-num" data-num="6">6</button>
      <button class="btn btn-op text-emerald-400" data-op="-">-</button>

      <!-- Baris 4: 1, 2, 3, Tambah -->
      <button class="btn btn-num" data-num="1">1</button>
      <button class="btn btn-num" data-num="2">2</button>
      <button class="btn btn-num" data-num="3">3</button>
      <button class="btn btn-op text-emerald-400" data-op="+">+</button>

      <!-- Baris 5: Backspace, 0, Persen -->
      <button class="btn btn-action text-slate-400" data-action="backspace">⌫</button>
      <button class="btn btn-num" data-num="0">0</button>
      <button class="btn btn-action text-emerald-400 font-semibold" data-action="percent">%</button>
      <div class="invisible"></div>

      <!-- Baris 6: Titik & Sama Dengan Memanjang -->
      <button class="btn btn-action text-emerald-400 font-bold" data-action="decimal">.</button>
      <button class="btn-equals col-span-3 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold text-xl rounded-xl transition-all duration-150 py-3 shadow-lg shadow-emerald-900/30 border border-emerald-500/40 active:scale-95 select-none" data-action="calculate">=</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
